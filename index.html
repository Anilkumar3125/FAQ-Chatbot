<!DOCTYPE html>
<html>
<head>
    <title>FAQ Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <h2>FAQ Chatbot</h2>

    <div id="chat-box">
        <p><b>Bot:</b> Hello! Ask me a question.</p>
    </div>

    <input type="text"
           id="user-input"
           placeholder="Type your question">

    <button onclick="sendMessage()">
        Send
    </button>
</div>

<script src="script.js"></script>

</body>
</html>
